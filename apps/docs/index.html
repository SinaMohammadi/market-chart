<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="market-chart: a free, open-source (MIT) financial charting library for React and TypeScript. Guides, live examples and API reference."
    />
    <!--
      Baseline policy for hosts that cannot send headers (e.g. GitHub Pages). Hosts that can should send the
      fuller header set in public/_headers instead (frame-ancestors only works as a header).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>market-chart docs</title>
    <!-- Applies the saved or system theme before the first paint (a file, so script-src 'self' suffices). -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
